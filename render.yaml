# EcoRuta unificado — deploy en Render (SOLO la app web)
# La base de datos vive en Aiven (free, 5 GB, sin expiración) — ver MIGRACION_AIVEN.md
# Conectar este repo (Zelaya02/Ecoruta) en Render → New → Blueprint → selecciona este archivo.
# IMPORTANTE: después del Blueprint, ve a Environment y pega tu connection string de Aiven
# en la variable DATABASE_URL (formato: postgresql://USER:PASS@HOST:PORT/dbname?sslmode=require)
services:
  - type: web
    name: ecoruta
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # pegar la connection string de Aiven (no usar la de Render)
      - key: FRONTEND_DIR
        value: /app/frontend
      # Opcional: distancias reales OSRM/ORS. Sin esto usa Haversine.
      - key: ORS_API_KEY
        sync: false
